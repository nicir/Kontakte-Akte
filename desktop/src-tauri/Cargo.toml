[package]
name = "kontakte-akte"
version = "1.0.0"
description = "Kontakte-Akte – Dein persönliches Netzwerk."
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "kontakte_akte_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }
getrandom = "0.2"
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
