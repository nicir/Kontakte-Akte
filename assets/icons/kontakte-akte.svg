<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Kontakte-Akte</title>
  <!-- Editable source artwork for the application icon.
       Simplified geometric brain (two hemispheres built from rounded lobes)
       on a white / very light orange rounded square. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF1E4"/>
    </linearGradient>
    <linearGradient id="brain" gradientUnits="userSpaceOnUse" x1="0" y1="268" x2="0" y2="746">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#9A3412" flood-opacity="0.18"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <!-- Tile -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#F3E3D6" stroke-width="3"/>

  <!-- Brain: left hemisphere lobes -->
  <g fill="url(#brain)" clip-path="url(#tileClip)">
    <circle cx="430" cy="372" r="104"/>
    <circle cx="336" cy="452" r="108"/>
    <circle cx="332" cy="578" r="100"/>
    <circle cx="420" cy="650" r="96"/>
    <rect x="360" y="330" width="146" height="390" rx="60"/>
    <!-- right hemisphere lobes (mirrored around x = 512) -->
    <circle cx="594" cy="372" r="104"/>
    <circle cx="688" cy="452" r="108"/>
    <circle cx="692" cy="578" r="100"/>
    <circle cx="604" cy="650" r="96"/>
    <rect x="518" y="330" width="146" height="390" rx="60"/>
  </g>

  <!-- Folds (white, rounded) -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="26">
    <!-- central fissure -->
    <path d="M512 290 L512 742"/>
    <!-- left -->
    <path d="M440 420 C400 420 378 448 380 486"/>
    <path d="M300 520 C340 520 372 540 380 576"/>
    <path d="M452 548 C420 560 410 600 430 632"/>
    <!-- right -->
    <path d="M584 420 C624 420 646 448 644 486"/>
    <path d="M724 520 C684 520 652 540 644 576"/>
    <path d="M572 548 C604 560 614 600 594 632"/>
  </g>
</svg>
